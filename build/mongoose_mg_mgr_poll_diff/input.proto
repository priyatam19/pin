syntax = "proto3";

message Input {
  bytes mgr = 1;
  int32 ms = 2;
}

message DnsDataPtr {
  bool present = 1;
  bytes value = 2;
}

message MgHttpMessagePtr {
  bool present = 1;
  bytes value = 2;
}

message MgHttpServeOptsPtr {
  bool present = 1;
  bytes value = 2;
}

message dns_data {
  bytes next = 1;
  bytes c = 2;
  uint64 expire = 3;
  uint32 txnid = 4;
}

message AnonymousStruct {
  bytes header = 1;
  bytes data = 2;
}

message packed_file {
  string data = 1;
  uint64 size = 2;
  uint64 pos = 3;
}

message printdirentrydata {
  bytes c = 1;
  bytes hm = 2;
  bytes opts = 3;
  string dir = 4;
}

message mg_mqtt_pmap {
  uint32 id = 1;
  uint32 type = 2;
}

message url {
  uint64 key = 1;
  uint64 user = 2;
  uint64 pass = 3;
  uint64 host = 4;
  uint64 port = 5;
  uint64 uri = 6;
  uint64 end = 7;
}

message ws_msg {
  uint32 flags = 1;
  uint64 header_len = 2;
  uint64 data_len = 3;
}

message mg_http_message {
  bytes raw = 1;
}

message mg_http_serve_opts {
  bytes raw = 1;
}
