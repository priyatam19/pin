syntax = "proto3";

message SubPtr {
  bool present = 1;
  sub value = 2;
}

message MgMqttMessagePtr {
  bool present = 1;
  mg_mqtt_message value = 2;
}

message MgStrPtr {
  bool present = 1;
  mg_str value = 2;
}

message Uint32ScalarPtr {
  bool has_value = 1;
  uint32 value = 2;
}

message sub {
  MgMqttMessagePtr msg = 1;
  MgStrPtr topic = 2;
  Uint32ScalarPtr qos = 3;
  uint64 pos = 4;
}
