syntax = "proto3";

message MgMqttMessagePtr {
  bool present = 1;
  mg_mqtt_message value = 2;
}

message MgStrPtr {
  bool present = 1;
  mg_str value = 2;
}

message Uint32ScalarPtr {
  bool has_value = 1;
  uint32 value = 2;
}

message Input {
  MgMqttMessagePtr msg = 1;
  MgStrPtr topic = 2;
  Uint32ScalarPtr qos = 3;
  int32 pos = 4;
}

message mg_str {
  string ptr = 1;
  int32 len = 2;
}

message mg_mqtt_message {
  MgStrPtr topic = 1;
  mg_str data = 2;
  mg_str dgram = 3;
  uint32 id = 4;
  uint32 cmd = 5;
  Uint32ScalarPtr qos = 6;
  uint32 ack = 7;
  int32 props_start = 8;
  int32 props_size = 9;
}
