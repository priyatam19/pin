syntax = "proto3";

message SubPtr {
  bool present = 1;
  sub value = 2;
}

message MgMqttMessagePtr {
  bool present = 1;
  mg_mqtt_message value = 2;
}

message MgStrPtr {
  bool present = 1;
  mg_str value = 2;
}

message Uint32ScalarPtr {
  bool has_value = 1;
  uint32 value = 2;
}

message Input {
  MgMqttMessagePtr msg = 1;
  MgStrPtr topic = 2;
  Uint32ScalarPtr qos = 3;
  uint64 pos = 4;
}

message mg_str {
  string ptr = 1;
  int32 len = 2;
}

message mg_mqtt_message {
  MgStrPtr topic = 1;
  mg_str data = 2;
  mg_str dgram = 3;
  uint32 id = 4;
  uint32 cmd = 5;
  Uint32ScalarPtr qos = 6;
  uint32 ack = 7;
  uint64 props_start = 8;
  uint64 props_size = 9;
}

message sub {
  bytes next = 1;
  bytes c = 2;
  MgStrPtr topic = 3;
  Uint32ScalarPtr qos = 4;
}
